<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900"><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#779180" stroke-width="1.5"/></marker><style>text{font-family:Arial,sans-serif;fill:#23352d}.eyebrow{font-size:14px;letter-spacing:3px;fill:#6d8575}.title{font-size:44px;letter-spacing:-1px}.label{font-size:24px}.body{font-size:17px;fill:#617668}.small{font-size:14px;fill:#6b7d72}.box{fill:#fffefa;stroke:#cbd9ce;stroke-width:2}.line{stroke:#779180;stroke-width:2;fill:none;marker-end:url(#arrow)}</style></defs><rect width="1440" height="900" fill="#f6f7f2"/><text x="70" y="75" class="eyebrow">QWITNESS / ARCHITECTURE</text><text x="70" y="139" class="title">The evidence travels with the answer.</text><text x="70" y="180" class="body">One TypeScript core. Bounded live data. A portable signature with explicit trust.</text><rect x="55" y="228" width="1330" height="382" rx="16" fill="#edf2e9"/><text x="80" y="264" class="eyebrow">ISSUANCE / SERVER</text><rect class="box" x="80" y="300" width="245" height="230" rx="10"/><text x="105" y="343" class="label">Web + MCP</text><text x="105" y="387" class="body">One allowed question</text><text x="105" y="418" class="body">USDC + DAI</text><text x="105" y="449" class="body">No wallet or transactions</text><text x="105" y="488" class="small">Same createMarketReceipt core</text><path d="M330 415H367" class="line"/><rect class="box" x="378" y="300" width="285" height="230" rx="10"/><text x="403" y="343" class="label">The Graph</text><text x="403" y="387" class="body">Aave V3 / Ethereum</text><text x="403" y="418" class="body">Pin a single indexed block</text><text x="403" y="449" class="body">Keep query + response</text><text x="403" y="488" class="small">Identity, units and size checks</text><path d="M668 415H705" class="line"/><rect class="box" x="716" y="300" width="280" height="230" rx="10"/><text x="741" y="343" class="label">Analysis policy</text><text x="741" y="387" class="body">Integer arithmetic</text><text x="741" y="418" class="body">Bounded LLM or</text><text x="741" y="449" class="body">explicit deterministic mode</text><text x="741" y="488" class="small">Evidence references + limitations</text><path d="M1001 415H1038" class="line"/><rect class="box" x="1049" y="300" width="310" height="230" rx="10"/><text x="1074" y="343" class="label">ML-DSA-65 receipt</text><text x="1074" y="387" class="body">Protected header + payload</text><text x="1074" y="418" class="body">Canonical JSON + context</text><text x="1074" y="449" class="body">Stable server-only signer</text><text x="1074" y="488" class="small">Detached signature + public key</text><text x="80" y="575" class="small">Provider and model output are untrusted. Time, result size, output tokens and per-process execution count are bounded.</text><path d="M1204 535V673" class="line"/><rect class="box" x="675" y="686" width="684" height="133" rx="10"/><text x="701" y="728" class="label">Offline verifier / HTML + CLI + MCP</text><text x="701" y="766" class="body">Signature integrity · Independent signer pin · Observation age</text><text x="701" y="797" class="small">No Graph, LLM, API, CDN or network required</text><text x="80" y="726" class="label">Trust is a separate input.</text><text x="80" y="763" class="body">An embedded key is not a trusted identity.</text><text x="80" y="794" class="body">A signature does not establish data truth.</text><path d="M545 754H658" class="line"/><text x="70" y="866" class="small">Unaudited prototype. Post-quantum protection applies to receipt signatures; it does not make Ethereum quantum-resistant.</text></svg>
